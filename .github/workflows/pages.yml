# Bouwt de site en zet ze op GitHub Pages bij elke push naar main.
name: Site naar GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Spelregels testen
        run: npm test
      - name: Site bouwen
        run: npm run build
      - name: Pages instellen
        uses: actions/configure-pages@v5
        with:
          # Probeert Pages zelf aan te zetten (bron: GitHub Actions) als dat
          # nog niet gebeurd is.
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
